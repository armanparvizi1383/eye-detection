<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تشخیص خستگی چشم</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Vazir', sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        #video-frame {
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 720px;
        }
        .btn-toggle {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <h1 class="mb-4 text-primary">سامانه هوشمند تشخیص خستگی چشم</h1>

    <img id="video-frame" src="{{ url_for('video_feed') }}" class="img-fluid" alt="Video Feed">

    <button id="toggleBtn" class="btn btn-warning btn-toggle">توقف دوربین</button>
</div>

<!-- Script to toggle camera -->
<script>
    const btn = document.getElementById("toggleBtn");
    let isOn = true;

    btn.addEventListener("click", () => {
        fetch("/toggle_camera", { method: "POST" })
            .then(response => response.json())
            .then(data => {
                isOn = data.status === "on";
                btn.textContent = isOn ? "توقف دوربین" : "شروع دوربین";
                btn.className = isOn ? "btn btn-warning btn-toggle" : "btn btn-success btn-toggle";
            });
    });
</script>

</body>
</html>
